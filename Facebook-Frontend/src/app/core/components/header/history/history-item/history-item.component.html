<a [routerLink]="['/', pathname(), 'posts']" (click)="onClose()">
  <div class="flex items-center justify-between hover:bg-hover p-[8px] rounded-md cursor-pointer">
      <div class="flex items-center gap-[12px]">
        <img [src]="getAvatarUrl(avatar())" alt="An avatar" class="w-[36px] h-[36px] rounded-full">
        <h1 class="text-[15px] font-medium">{{ fullName() }}</h1>
      </div>
      <span class="flex items-center justify-center size-[28px] rounded-full hover:bg-white/50">
        <i class="fa-solid fa-xmark text-icon rounded-full"></i>
      </span>
  </div>
</a>
