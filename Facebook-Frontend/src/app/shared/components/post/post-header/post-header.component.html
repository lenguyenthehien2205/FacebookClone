<div class="w-full flex items-center justify-between px-4 pt-3 pb-2 relative">
    <div class="flex items-center gap-2">
        <span visual class="relative w-[40px] h-[40px] flex items-center justify-center rounded-full bg-grey2 shadow-lg">
            <a [routerLink]="['/', pathname(), 'posts']" class="group">
                <img [src]="avatar()" alt="" class="w-[40px] h-[40px] rounded-full group-hover:brightness-[0.85]">
            </a>
            @if (isOnline()) {
                <span class="absolute bottom-0 right-0 w-[12px] h-[12px] bg-green rounded-full border-[3px] border-background"></span>
            }
        </span>
        <div class="flex flex-col">
            <a [routerLink]="['/', pathname(), 'posts']" class="text-text text-[15px] font-medium hover:underline">{{ username() }}</a>
            <div class="text-grey text-[13px] flex items-center">
                <app-custom-title [titleCustom]="time()" [y]="5" [center]="true">
                    <span class="font-medium hover:underline cursor-pointer">{{ timeAgo() }}</span>
                </app-custom-title>
                <span class="px-[3px]"> · </span>
                <app-custom-title [titleCustom]="getConvertedPrivacy(privacy())" [y]="-55" [center]="true">
                    <i [ngClass]="getPrivacyIcon(privacy()) + ' text-[12px] cursor-auto'"></i>
                </app-custom-title>
            </div>
        </div>
    </div>
    <div class="flex items-center">
        <span class="size-[36px] leading-[36px] text-center hover:bg-hover rounded-full cursor-pointer" (click)="toggleOptions()" [ngClass]="{
            'bg-hover': isOptionsOpen
        }" [id]="'option-button'+postId()">
            <i class="fa-solid fa-ellipsis text-grey text-[20px]"></i>
        </span>
        @if(hiddenIcon()){
            <span class="size-[36px] leading-[36px] text-center hover:bg-hover rounded-full cursor-pointer">
                <i class="fa-solid fa-xmark text-grey text-[20px]"></i>
            </span>
        }
    </div>
    @if(isOptionsOpen && options()){
        <app-post-options [isOpen]="isOptionsOpen" (onClose)="closeOptions()" [id]="'options'+postId()" class="absolute top-[50px] right-[30px]" (editPost)="onShowPostForm()" (deletePost)="onDelete()"></app-post-options>
    }
</div>
@if(isShowPostForm){
    <app-post-form title="Chỉnh sửa bài viết" type="edit" [postId]="postId()" (closePostForm)="onHidePostForm()"/>
}
